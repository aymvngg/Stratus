name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish Stratus/Stratus.csproj -c Release -p:Platform=x64 -o publish/Stratus-win-x64

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/Stratus-win-x64/* -DestinationPath "publish/Stratus-${{ github.ref_name }}-win-x64.zip" -CompressionLevel Optimal

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notesFile = "publish/notes.md"
          $useNotes = $false
          if (Test-Path CHANGELOG.md) {
            $content = Get-Content CHANGELOG.md -Raw
            $pattern = "(?s)##\s+$([regex]::Escape($tag))\r?\n(.*?)(?=\r?\n##\s|\z)"
            if ($content -match $pattern) {
              $section = $Matches[1].Trim()
              if (-not [string]::IsNullOrWhiteSpace($section)) {
                Set-Content -Path $notesFile -Value $section -NoNewline
                $useNotes = $true
              }
            }
          }
          if ($useNotes) {
            gh release create "$tag" "publish/Stratus-$tag-win-x64.zip" --title "Stratus $tag" --notes-file "$notesFile"
          } else {
            Write-Warning "No '## $tag' section found in CHANGELOG.md, falling back to generated notes."
            gh release create "$tag" "publish/Stratus-$tag-win-x64.zip" --title "Stratus $tag" --generate-notes
          }
